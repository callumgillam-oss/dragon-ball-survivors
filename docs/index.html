/* ===== v12: persistent storage layer =====
   localStorage first (sync), mirrored to IndexedDB, in-memory fallback if the browser blocks both.
   Everything the game saves goes through `store`, which has the same API as localStorage. */
const store=(()=>{
 const mem={};let ok=false,tmr=0;
 try{localStorage.setItem('dbs_probe','1');ok=localStorage.getItem('dbs_probe')==='1'}catch(e){ok=false}
 if(ok)try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('dbs_')==0)mem[k]=localStorage.getItem(k)}}catch(e){}
 const snap=()=>{const d={};for(const k in mem)if(k!='dbs_probe')d[k]=mem[k];return d};
 function idb(cb){try{const r=indexedDB.open('dbs_save',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>cb(r.result);r.onerror=()=>cb(null);r.onblocked=()=>cb(null)}catch(e){cb(null)}}
 function flush(){clearTimeout(tmr);idb(d=>{if(!d)return;try{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put({ts:+mem.dbs_ts||0,d:snap()},'all');tx.oncomplete=tx.onerror=tx.onabort=()=>d.close()}catch(e){try{d.close()}catch(_){}}})}
 const mirror=()=>{clearTimeout(tmr);tmr=setTimeout(flush,700)};
 return{
  get ok(){return ok},
  getItem:k=>Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null,
  setItem(k,v){mem[k]=String(v);mem.dbs_ts=String(Date.now());if(ok)try{localStorage.setItem(k,mem[k]);localStorage.setItem('dbs_ts',mem.dbs_ts)}catch(e){ok=false}mirror()},
  removeItem(k){delete mem[k];mem.dbs_ts=String(Date.now());if(ok)try{localStorage.removeItem(k);localStorage.setItem('dbs_ts',mem.dbs_ts)}catch(e){}mirror()},
  keys:()=>Object.keys(mem),
  flush,
  // if the IndexedDB copy is newer than what localStorage gave us (e.g. localStorage was wiped), adopt it
  hydrate(cb){idb(d=>{if(!d)return cb(false);let done=false;const fin=v=>{if(!done){done=true;try{d.close()}catch(e){}cb(v)}};
   try{const g=d.transaction('kv').objectStore('kv').get('all');
    g.onsuccess=()=>{const r=g.result;if(r&&r.d&&(+r.ts||0)>(+mem.dbs_ts||0)){for(const k of Object.keys(mem))if(k!='dbs_probe'&&!(k in r.d)){delete mem[k];if(ok)try{localStorage.removeItem(k)}catch(e){}}
      for(const k in r.d){mem[k]=r.d[k];if(ok)try{localStorage.setItem(k,r.d[k])}catch(e){}}fin(true)}else fin(false)};
    g.onerror=()=>fin(false)}catch(e){fin(false)}})}
 }
})();

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,ST=0,SI=0,SB=0,ZM=1;
let DPR=1,DPRCAP=2,fEma=16;
/* ===== v2.0: one world view for every device =====
   Every screen shows the SAME amount of world (about 480x900 worth of area, never less than 440 on the short side),
   then scales it to fit. A big monitor just shows it bigger, so spawns, pace and XP are identical on phone, tablet and PC. */
const VIEW_AREA=480*900,VIEW_MIN=440;
// Graphics quality: render-resolution caps per level. 'auto' starts high and only steps down if frames are slow.
const GFX_NAMES={auto:'Auto',high:'High',med:'Medium',low:'Low'},GFX_CAP={high:3,med:2,low:1.25};
let GFX='auto';try{const g=store.getItem('dbs_gfx');if(g&&GFX_NAMES[g])GFX=g}catch(e){}
DPRCAP=GFX=='auto'?2.5:GFX_CAP[GFX];
let rsPend=true;
// Resizing a canvas wipes it, so only ever resize at the START of a frame, right before drawing (no black flicker).
function rs(){rsPend=true}
function rsApply(){rsPend=false;const vw=innerWidth,vh=innerHeight;
 // iOS can report a 0x0 viewport for a moment when the app returns from the background: keep the last good size and retry
 if(!(vw>0&&vh>0)){rsPend=true;if(!(W>0&&H>0)){W=VIEW_MIN;H=VIEW_MIN;ZM=1}return}
 ZM=Math.min(Math.sqrt(vw*vh/VIEW_AREA),Math.min(vw,vh)/VIEW_MIN);
 DPR=Math.min(DPRCAP,window.devicePixelRatio||1)*ZM;W=vw/ZM;H=vh/ZM;
 const cw=Math.round(vw*Math.min(DPRCAP,window.devicePixelRatio||1)),ch=Math.round(vh*Math.min(DPRCAP,window.devicePixelRatio||1));
 if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
 DPR=cw/W;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 const cs=getComputedStyle($('probe')),px=k=>parseFloat(cs[k])||0;
 ST=px('paddingTop')/ZM;SI=Math.max(px('paddingLeft'),px('paddingRight'))/ZM;SB=px('paddingBottom')/ZM;
 document.documentElement.classList.toggle('land',vw>vh)}
addEventListener('resize',rs);addEventListener('orientationchange',()=>{rs();setTimeout(rs,300);setTimeout(rs,800)});
if(window.visualViewport)visualViewport.addEventListener('resize',rs);rsApply();
const hash=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const el=(x,y,a,b)=>{ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,7);ctx.fill()};
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let joy=null;
// Floating joystick: the base follows your thumb so you never have to drag toward the screen edge
const JR=50;
cv.addEventListener('pointerdown',e=>{if(S.mode=='intro'){e.preventDefault();introEnd();return}if(joy)return;e.preventDefault();joy={ox:e.clientX/ZM,oy:e.clientY/ZM,x:e.clientX/ZM,y:e.clientY/ZM,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(joy&&e.pointerId==joy.id){joy.x=e.clientX/ZM;joy.y=e.clientY/ZM;
 const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>JR){joy.ox=joy.x-dx/d*JR;joy.oy=joy.y-dy/d*JR}}});
addEventListener('pointerup',e=>{if(joy&&e.pointerId==joy.id)joy=null});
addEventListener('pointercancel',e=>{if(joy&&e.pointerId==joy.id)joy=null});

// Stop iOS from scrolling, rubber-banding, zooming or long-pressing the page while playing
const inOv=e=>e.target&&e.target.closest&&e.target.closest('#ov');

document.addEventListener('touchstart',e=>{if(e.target===cv)e.preventDefault()},{passive:false});

 S={t:0,mode:'menu',p:{x:0,y:0,hp:100+UPL('hp')*META.hp,max:100+UPL('hp')*META.hp,lv:1,xp:0,nx:6,face:1},
  w:{blast:1,kame:0,aura:0,flare:0,disc:0,bomb:0,masenko:0,hell:0,thunder:0},ps:{zen:0,spd:0,sen:0,cdr:0,arm:0,rad:0,area:0,amt:0},pe:{zen:0,spd:0,sen:0,cdr:0,arm:0,rad:0,area:0,amt:0},myth:{},rw:{},pn:{},pm:{},rn:{},rm:{},pity:0,luckN:0,offer:null,
  cd:{blast:0,kame:1,aura:0,flare:6,disc:0,bomb:4,masenko:0,hell:1,thunder:2},en:[],mas:[],orbs:[],str:[],arcs:[],fields:[],rb:[],rbq:[],sh:[],eb:[],gem:[],beams:[],fx:[],zones:[],discs:[],evo:{},da:0,chests:[],beans:[],eliteT:35,nums:[],

}

const dm=()=>(1-(1-DPD[DLV])*Math.min(1,S.t/180))*(1+.2*S.pe.zen+(S.wishDmg||0)+UPL('dmg')*META.dmg)*(S.ssj?1.5:1)*(S.hero=='goku'&&S.p.hp<S.p.max*.4?1.25:1)*(S.rage>0?1.3:1);

function start(st){const k=S,ps=k.stage||1;unlockAudio();init();S.stage=st||ps;S.eliteT=S.stage==2?65:35;show('');S.mode='intro';S.intro={t:0}}

function near(n,maxd=520){
 const p=S.p;return S.en.filter(e=>!e.dead&&onScr(e)&&Math.hypot(e.x-p.x,e.y-p.y)<maxd)
  .sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,n);
}

const DNAMES=['Normal','Hard','Insane'],DF=[.8,1.15,1.6],DPD=[.8,.65,.5]; // DF scales enemy toughness; DPD = your damage multiplier
let DLV=1;try{const v=+store.getItem('dbs_diff');if(v>=0&&v<=2&&store.getItem('dbs_diff')!==null)DLV=v}catch(e){}
const DIFF={
 hp:t=>(1+.6*Math.min(1,t/180))*(1+(t/85+Math.pow(t/230,2.3))*DF[DLV]*(S.stage==2?.8:1)),   // mob HP multiplier (Hard: ~2.6x at 2min, ~6.4x at 5min, ~11x at 7.5min)

function spawnE(k){
 const T=TYPES[k],a=Math.random()*6.283,d=Math.hypot(W,H)/2+30,sc=T.boss?DIFF.boss(k):DIFF.hp(S.t)*eh();
 S.en.push({k,x:S.p.x+Math.cos(a)*d,y:S.p.y+Math.sin(a)*d,hp:T.hp*sc,max:T.hp*sc,spd:T.spd*(T.boss?1:(1+Math.random()*.15)*DIFF.spd(S.t)),r:T.r,boss:T.boss,st:0,fz:0,fl:0,tm:2,dash:0,dx:0,dy:0});

 if(S.fx.length<170)for(let i=0;i<(r>40?5:2);i++){const a=Math.random()*6.283,s=10+Math.random()*40;S.fx.push({x:x+Math.cos(a)*6,y:y+Math.sin(a)*6,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:.6,T:.6,c:'#9a8468',s:5+Math.random()*(r>40?10:5)})}

// You can only hurt (or target) enemies that are on screen, so threats get to ENTER the screen before they die.

function onScr(e){if(e.boss||e.k=='snp'||e.k=='fs')return true;return Math.abs(e.x-S.p.x)<W/2+e.r+16&&Math.abs(e.y-S.p.y)<H/2+e.r+16}

 boom(e.x,e.y,e.boss?60:18,e.k=='blue'?'#6cf':'#9f4');

function lvlUp(){
 if(S.pend<=0){S.mode='play';show('');return}
 S.mode='lvl';
 const all=offerPool();
 all.sort(()=>Math.random()-.5);const c=all.slice(0,3);
 if(!c.length){S.pend=0;S.p.hp=S.p.max;S.mode='play';show('');return}
 show(`<div class="card"><h2>Power up! Level ${S.p.lv}</h2>`+c.map(([g,k])=>{const l=S[g][k];
  return `<button onclick="pick('${g}','${k}')"><b>${INFO[k][0]}</b> ${l?`<small>Lv ${l} → ${l+1}</small>`:'<span class="new">NEW</span>'}<br><small>${INFO[k][1]}</small></button>`}).join('')+`</div>`);
}
function pick(g,k){
 S[g][k]++;if(k=='sen'){S.p.max+=20;S.p.hp=S.p.max}

function update(dt){
 const p=S.p;S.t+=dt;S.hurt-=dt;S.flash-=dt*1.5;if(S.ban){S.ban.t-=dt;if(S.ban.t<=0)S.ban=null}
 let mx=0,my=0;
 if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;
 if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){const k=Math.min(1,d/50)/d;mx=dx*k;my=dy*k}else{mx=my=0}}
 else{const l=Math.hypot(mx,my);if(l){mx/=l;my/=l}}
 if(GP.x||GP.y){mx=GP.x;my=GP.y}
 const sp=135*(1+.13*S.pe.spd+UPL('spd')*META.spd)*(S.ssj?1.3:1)*(S.slow>0?.45:1);p.x+=mx*sp*dt;p.y+=my*sp*dt;p.mag=Math.hypot(mx,my);S.mvx=mx;S.mvy=my;p.atk=Math.max(0,(p.atk||0)-dt);if(mx&&!(p.atk>0))p.face=mx>0?1:-1;
 p.hp=Math.min(p.max,p.hp+(.12+.9*S.pe.sen+heroRegen())*dt);

 // spawning
 S.spawn-=dt;
 if(S.spawn<=0&&S.en.length<(S.stage==2?125:230)){
  S.spawn=Math.max(.1,.66-S.t/440)/ramp();const n=Math.max(1,Math.round((1+Math.floor(S.t/70))*(S.stage==2?.6:1)));
  for(let i=0;i<n;i++)spawnE(pickE());
 }
 
 

 // tense moments: alternating wall / ring, faster as the run goes on
 S.evT=(S.evT??55)-dt;
 if(S.evT<=0&&!S.en.some(e=>e.boss)){S.evT=Math.max(30,48-S.t/30)*DIFF.evGap;S.evN=(S.evN||0)+1;
  if(S.evN%2){wall();ban('RAPTOR WALL! FIND THE GAP')}else{swarm();ban('SURROUNDED! BREAK THROUGH THE GAP')}}
 // weapons
 const W_=S.w;
 S.cd.blast-=dt;
 if(S.cd.blast<=0&&W_.blast){
  const L=W_.blast;S.cd.blast=(S.evo.blast?.15:Math.max(.26,.7-.09*L))*cm();const E=S.evo.blast,n=(E?4:1+(L>=2)+(L>=3)+(L>=5))+PX(),ts=near(n);if(ts.length&&(p.mag||0)<.3&&!(p.atk>0)){p.atk=p.ad=.36;p.face=ts[0].x>p.x?1:-1}
  if(ts.length)for(let i=0;i<n;i++){const e=ts[i%ts.length],a=Math.atan2(e.y-p.y,e.x-p.x);
   {const a2=a+(E?(Math.random()-.5)*.4:i>=ts.length?(Math.random()-.5)*.3:0);S.sh.push({x:p.x,y:p.y,vx:Math.cos(a2)*440,vy:Math.sin(a2)*440,l:1.2,d:(5+WL('blast')*2.2)*WB.blast*dm()*(E?1.6:1),pr:E?5:L>=5?3:L>=3?2:1,kb:E?8:14,h:[],hm:MY('blast'),sp:MY('blast')?34*AR2():0})}}
  else S.cd.blast=.1;
 }
 if(W_.kame){
  S.cd.kame-=dt;
  if(S.cd.kame<=0){
   const L=W_.kame,ts=near(1,650);S.cd.kame=(S.evo.kame?2.4:Math.max(2.4,5.2-.55*L))*cm();
   p.atk=p.ad=.55;if(ts.length)p.face=ts[0].x>p.x?1:-1;const a=ts.length?Math.atan2(ts[0].y-p.y,ts[0].x-p.x):(p.face>0?0:Math.PI);
   kameBeams(a,L);
   
  }
 }
 if(W_.aura){
  S.cd.aura-=dt;
  if(S.cd.aura<=0){S.cd.aura=S.evo.aura?.22:.3;const L=W_.aura,E=S.evo.aura,R=(50+10*WL('aura'))*(E?1.8:1)*AR();
   for(const e of S.en)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<R+e.r){hitE(e,(3+2*WL('aura'))*dm()*(E?1.3:WB.aura));shove(e,p.x,p.y,E?9:6);if(E)p.hp=Math.min(p.max,p.hp+.12)}}
 }
 if(W_.flare){
  S.cd.flare-=dt;
  if(S.cd.flare<=0){const L=W_.flare;S.cd.flare=(S.evo.flare?4:Math.max(5,13-1.4*L))*cm();aFlash(1);
   for(const e of S.en)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<(S.evo.flare?900:600)*AR2()){e.st=(1+.4*WL('flare'))*(S.evo.flare?1.6:1)*(MY('flare')?1.25:1)*(e.boss?.5:1);if(MY('flare'))e.mk=5;hitE(e,(S.evo.flare?34+8*WL('flare'):9+4*WL('flare'))*WB.flare*dm())}}
 }
 for(const s of S.sh){
  if(s.hm)homeS(s,dt);s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;
  for(const e of S.en){if(e.dead||s.h.includes(e))continue;
   if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+6*AR2()){hitE(e,s.d);if(s.kb&&!e.boss&&!e.elite){const q_=Math.hypot(s.vx,s.vy)||1;e.x+=s.vx/q_*s.kb;e.y+=s.vy/q_*s.kb}if(s.sp){splash(e.x,e.y,s.sp,s.d*.5,e);pop(e.x,e.y,s.sp,'#8cf')}s.h.push(e);if(--s.pr<=0){s.l=0;break}}}
 }
 for(const b of S.beams){
  b.t-=dt;const c=Math.cos(b.a),s=Math.sin(b.a);if(b.clr)for(const q of S.eb){const dx=q.x-p.x,dy=q.y-p.y,al=dx*c+dy*s;if(al>0&&al<820&&Math.abs(-dx*s+dy*c)<b.w/2)q.l=0}
  for(const e of S.en){if(e.dead||b.h.has(e))continue;
   const dx=e.x-p.x,dy=e.y-p.y,al=dx*c+dy*s,pp=Math.abs(-dx*s+dy*c);
   if(al>0&&al<(b.len||650)&&pp<b.w/2+e.r){hitE(e,beamDmg(b,e));b.h.add(e);if(b.kb&&!e.boss&&!e.dead){e.x+=c*b.kb;e.y+=s*b.kb}}}
 }

 updExtra(dt);updHero(dt);updNew(dt);updB(dt);updBalls(dt);
 // enemies
 for(const e of S.en){
  if(e.dead)continue;if(e.fl>0)e.fl-=dt;
  if(e.st>0){e.st-=dt;continue}
  if(e.line){const q=e.line;e.x+=q.vx*dt;e.y+=q.vy*dt;q.t-=dt;if(q.t<=0){e.dead=1;continue}if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+10)hitP(e,DIFF.contact*1.2);continue}
  if(AI[e.k]){AI[e.k](e,dt);continue}
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.k=='sai'||e.k=='blue'){
   if(e.fz>0){e.fz-=dt;if(e.fz<=0){
     if(Math.hypot(dx,dy)<58)hurtP((e.k=='blue'?14:10)*(e.elite?1.8:1)*DIFF.dmg(S.t));
     boom(e.x,e.y,58,'#ffd54a');e.hp=0;killE(e)}}
   else{e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<e.r+22)e.fz=.7}
  }else{
   let v=e.spd;
   if(e.k=='rad'){e.tm-=dt;if(e.dash>0){e.dash-=dt;v=330;e.x+=e.dx*v*dt;e.y+=e.dy*v*dt;}
    else{if(e.tm<=0){e.tm=3;e.dash=.6;e.dx=dx/d;e.dy=dy/d}e.x+=dx/d*v*dt;e.y+=dy/d*v*dt}}
   else{e.x+=dx/d*v*dt;e.y+=dy/d*v*dt;e.tm-=dt;
    if(e.tm<=0){e.tm=2.6;for(let i=0;i<12;i++){const a=i/12*6.283+Math.random()*.2;S.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,l:4})}}}
   if(d<e.r+10){if(e.boss)hurtP(e.k=='nap'?18:12);else hitP(e,DIFF.contact)}
  }
 }
 // enemies left far behind are recycled onto the edge of the screen AHEAD of you (no off-screen trains, no free kiting)
 {const R=Math.hypot(W,H)/2+30,far=R+140;for(const e of S.en){if(e.dead||e.boss||e.line)continue;const dx=e.x-p.x,dy=e.y-p.y;
  if(dx*dx+dy*dy>far*far){let a=Math.random()*6.283;if(Math.hypot(S.mvx||0,S.mvy||0)>.3)a=Math.atan2(S.mvy,S.mvx)+(Math.random()-.5)*1.6;e.x=p.x+Math.cos(a)*R;e.y=p.y+Math.sin(a)*R}}}
 for(const b of S.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<14){hurtP(b.dm||10);b.l=0}}
 // gems
 const mag=(70+6*p.lv+30*S.pe.rad)*(1+.1*(META.magnet||0));
 for(const g of S.gem){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);
  if(d<mag){g.x+=dx/d*320*dt;g.y+=dy/d*320*dt}
  if(d<14){g.got=1;addXp(g.v)}}
 for(const f of S.fx){f.l-=dt;if(!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt}}
 S.en=S.en.filter(e=>!e.dead);S.sh=S.sh.filter(s=>s.l>0);S.eb=S.eb.filter(b=>b.l>0);
 S.beams=S.beams.filter(b=>b.t>0);S.gem=S.gem.filter(g=>!g.got);S.fx=S.fx.filter(f=>f.l>0);
 if(p.hp<=0&&S.mode=='play'){S.mode='over';endCard(false)}
}

function goku(x,y,face){
 ctx.fillStyle='rgba(0,0,0,.3)';el(x,y+15,11,4);
 ctx.fillStyle='#2a5bd7';ctx.fillRect(x-6,y+5,5,10);ctx.fillRect(x+1,y+5,5,10);
 ctx.fillStyle='#ff8a1c';ctx.fillRect(x-8,y-9,16,15);
 ctx.fillStyle='#2a5bd7';ctx.fillRect(x-8,y+2,16,3);
 ctx.fillStyle='#ffcf9a';ctx.fillRect(x-11,y-8,4,8);ctx.fillRect(x+7,y-8,4,8);
 ctx.beginPath();ctx.arc(x,y-15,7,0,7);ctx.fill();
 ctx.fillStyle='#111';ctx.beginPath();
 [[-8,-14],[-9,-24],[-4,-19],[-2,-29],[2,-20],[6,-28],[7,-19],[10,-23],[8,-13],[0,-18]].forEach(([a,b],i)=>i?ctx.lineTo(x+a,y+b):ctx.moveTo(x+a,y+b));
 ctx.fill();
 ctx.fillRect(x+face*2-1,y-15,2,3);ctx.fillRect(x+face*5-1,y-15,2,3);
}
function enemy(e,x,y){
 const T=TYPES[e.k],r=e.r,f=e.fl>0||(e.fz>0&&Math.floor(S.t*14)%2);
 ctx.fillStyle='rgba(0,0,0,.28)';el(x,y+r*.9,r,r*.35);
 if(e.boss){
  ctx.fillStyle=f?'#fff':'#6b3d1a';ctx.fillRect(x-r*.7,y-r*.3,r*1.4,r*1.2);
  ctx.fillStyle=f?'#fff':'#e0a070';ctx.beginPath();ctx.arc(x,y-r*.7,r*.55,0,7);ctx.fill();
  if(e.k=='rad'){ctx.fillStyle=f?'#fff':'#111';ctx.beginPath();
   [[-12,-6],[-30,10],[-12,2],[-26,24],[-6,6],[-10,28],[0,8],[8,28],[8,2],[22,24],[10,-6],[8,-30],[-4,-20],[-10,-30]].forEach(([a,b],i)=>{const px=x+a*r/20,py=y+b*r/20-r*.7;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.fill()}
  else{ctx.fillStyle='#111';ctx.fillRect(x-r*.3,y-r*.55,r*.6,3);}
  ctx.fillStyle='#111';ctx.fillRect(x-r*.3,y-r*.8,3,3);ctx.fillRect(x+r*.15,y-r*.8,3,3);
 }else{
  ctx.fillStyle=f?'#fff':T.col;el(x,y+4,r*.7,r*.85);
  ctx.beginPath();ctx.arc(x,y-r*.35,r*.8,0,7);ctx.fill();
  ctx.fillRect(x-r*.6,y-r*1.15,3,5);ctx.fillRect(x+r*.4,y-r*1.15,3,5);
  ctx.fillStyle='#111';el(x-r*.32,y-r*.4,2.6,3.6);el(x+r*.32,y-r*.4,2.6,3.6);
  ctx.fillStyle='#f33';ctx.fillRect(x-r*.32-1,y-r*.45,2,2);ctx.fillRect(x+r*.32-1,y-r*.45,2,2);
 }
 if(e.st>0){ctx.strokeStyle='#ffe066';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-r*1.3,5,0,7);ctx.stroke()}
}
function draw(){
 const p=S.p,cx=p.x-W/2,cy=p.y-H/2,G=90;
 ctx.fillStyle='#c79a5b';ctx.fillRect(0,0,W,H);
 for(let gx=Math.floor(cx/G)-1;gx<=(cx+W)/G;gx++)for(let gy=Math.floor(cy/G)-1;gy<=(cy+H)/G;gy++){
  const h=hash(gx,gy),x=gx*G+hash(gy,gx)*G-cx,y=gy*G+hash(gx+7,gy+3)*G-cy;
  if(h<.14){const s=10+h*120;ctx.fillStyle='#6f5f4d';el(x,y,s,s*.6);ctx.fillStyle='#8c7a65';el(x-s*.15,y-s*.15,s*.7,s*.4)}
  else if(h<.26){ctx.strokeStyle='#9a7640';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y+8);ctx.lineTo(x+30,y-4);ctx.lineTo(x+52,y+6);ctx.stroke()}
  else if(h<.34){ctx.fillStyle='rgba(120,80,30,.22)';el(x,y,32,13)}
 }
 for(const g of S.gem){const x=g.x-cx,y=g.y-cy;ctx.fillStyle='#ffa000';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.fillStyle='#d32f2f';ctx.fillRect(x-1,y-1,2,2)}
 const ens=S.en.slice().sort((a,b)=>a.y-b.y);
 for(const e of ens){const x=e.x-cx,y=e.y-cy;if(x<-60||y<-60||x>W+60||y>H+60)continue;enemy(e,x,y)}
 for(const b of S.eb){ctx.fillStyle='#d9a0ff';ctx.beginPath();ctx.arc(b.x-cx,b.y-cy,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x-cx,b.y-cy,2.5,0,7);ctx.fill()}
 // aura
 if(S.w.aura){const R=50+10*WL('aura'),pl=1+.06*Math.sin(S.t*12);
  const g=ctx.createRadialGradient(W/2,H/2,R*.3,W/2,H/2,R*pl);g.addColorStop(0,'rgba(255,60,30,0)');g.addColorStop(.8,'rgba(255,70,30,.28)');g.addColorStop(1,'rgba(255,40,20,.0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(W/2,H/2,R*pl,0,7);ctx.fill()}
 if(!(S.hurt>0&&Math.floor(S.t*20)%2))goku(W/2,H/2,p.face);
 for(const s of S.sh){const x=s.x-cx,y=s.y-cy;ctx.fillStyle='#7fe0ff';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
 for(const b of S.beams){const k=b.t/b.T,w=b.w*Math.min(1,k*3);ctx.save();ctx.translate(W/2,H/2);ctx.rotate(b.a);
  ctx.fillStyle='rgba(80,190,255,.55)';ctx.fillRect(0,-w/2,650,w);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(0,-w/4,650,w/2);
  ctx.fillStyle='#bff';ctx.beginPath();ctx.arc(0,0,w*.7,0,7);ctx.fill();ctx.restore()}
 for(const f of S.fx){const x=f.x-cx,y=f.y-cy,k=f.l/f.T;
  if(f.ring){ctx.fillStyle=f.c;ctx.globalAlpha=k*.7;ctx.beginPath();ctx.arc(x,y,f.r*(1.2-k*.7),0,7);ctx.fill();ctx.globalAlpha=1}
  else{ctx.fillStyle=f.c;ctx.globalAlpha=k;ctx.fillRect(x,y,f.s,f.s);ctx.globalAlpha=1}}
 if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.8,S.flash)+')';ctx.fillRect(0,0,W,H)}
 if(joy){ctx.strokeStyle='rgba(255,244,224,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,40,0,7);ctx.stroke();
  const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  ctx.fillStyle='rgba(255,154,31,.6)';ctx.beginPath();ctx.arc(joy.ox+Math.cos(a)*d,joy.oy+Math.sin(a)*d,16,0,7);ctx.fill()}

function gpToast(t){let d=document.getElementById('gptoast');if(!d){d=document.createElement('div');d.id='gptoast';d.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:#2b1a0d;color:#ffe9b8;border:2px solid #ffb458;border-radius:10px;padding:6px 12px;font:600 13px system-ui,sans-serif;z-index:50;pointer-events:none;transition:opacity .4s;white-space:nowrap';document.body.append(d)}
 d.textContent=t;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(()=>d.style.opacity=0,2400)}
{const st=document.createElement('style');st.textContent='#ov button.gpf{outline:3px solid #ffe27a!important;outline-offset:2px;background:#55331a}';document.head.append(st)}
addEventListener('gamepadconnected',e=>{GP.on=true;GP.id=e.gamepad.id;gpToast('🎮 Controller connected')});
addEventListener('gamepaddisconnected',()=>{if(!gpPads().some(p=>p&&p.connected)){GP.on=false;GP.x=GP.y=0;if(S.mode=='play')pz.onclick();gpToast('🎮 Controller disconnected')}});
const gpBtns=()=>[...ov.querySelectorAll('button')].filter(b=>b.offsetParent!==null&&!b.disabled);
function gpFocus(b){if(!b)return;ov.querySelectorAll('.gpf').forEach(x=>x.classList.remove('gpf'));b.classList.add('gpf');try{b.focus({preventScroll:true})}catch(e){}try{b.scrollIntoView({block:'nearest'})}catch(e){}}
function gpAuto(){const l=gpBtns();gpFocus(l.find(b=>b.classList.contains('go'))||l[0])}
function gpMove(d){const l=gpBtns();if(!l.length)return;let i=l.indexOf(document.activeElement);i=i<0?(d>0?0:l.length-1):Math.max(0,Math.min(l.length-1,i+d));gpFocus(l[i])}
function gpPoll(){
 let g=null;for(const p of gpPads())if(p&&p.connected){g=p;break}
 const now=performance.now(),ovVis=ov.style.display=='flex'&&S.mode!='intro';
 if(ovVis&&!GP.ovVis)GP.ovSince=now;GP.ovVis=ovVis;
 if(!g){GP.x=GP.y=0;GP.prev=[];return}
 if(!GP.on){GP.on=true;GP.id=g.id}
 const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=i=>g.axes[i]||0,dn=i=>B(i)&&!GP.prev[i];
 // movement: left stick (analog) or D-pad
 let x=ax(0),y=ax(1);if(B(14))x=-1;if(B(15))x=1;if(B(12))y=-1;if(B(13))y=1;
 const m=Math.hypot(x,y),dz=.2;if(m<dz){x=y=0}else{const k=Math.min(1,(m-dz)/(1-dz))/m;x*=k;y*=k}
 GP.x=x;GP.y=y;
 if(S.mode=='intro'){if([0,1,2,3,9].some(dn))introEnd()}
 else if(ovVis){
  if(!gpBtns().includes(document.activeElement))gpAuto();
  const ay=ax(1),axx=ax(0),dir=(B(13)||B(15)||ay>.6||axx>.6)?1:(B(12)||B(14)||ay<-.6||axx<-.6)?-1:0;
  if(dir!==GP.navDir){GP.navDir=dir;if(dir){gpMove(dir);GP.navT=now+340}}else if(dir&&now>GP.navT){gpMove(dir);GP.navT=now+170}
  const armed=now-GP.ovSince>450;                       // ignore the button that was mashed as the card opened
  if(armed&&dn(0)){const a=document.activeElement;if(gpBtns().includes(a))a.click()}
  if(S.mode=='pause'&&!svWelcomeOn&&armed&&(dn(9)||dn(1)))resume();
 }else if(S.mode=='play'){
  if(dn(0)||dn(2)||dn(5)||dn(7))ultFire();             // A / X / R1 / R2 = Ki Burst
  if(dn(9)||dn(8)||dn(1))pz.onclick();                 // Start / Select / B = pause
 }
 GP.prev=g.buttons.map(b=>b.pressed);
}
setInterval(gpPoll,16);
function gpStatus(){return GP.blocked?'Controller access is blocked by this page.':GP.on?'Controller connected: '+String(GP.id||'gamepad').split('(')[0].trim():'No controller detected yet. Connect it, then press any button.'}
{const _m=menu;menu=function(){_m();const c=ov.querySelector('.in')||ov.querySelector('.card');if(c&&GP.on){const p=document.createElement('p');p.innerHTML='<small>🎮 Left stick move · A Ki Burst · Start pause · D-pad and A in menus</small>';c.appendChild(p)}}}

// resume an interrupted run straight away; if IndexedDB held newer data than localStorage, adopt it
svWelcome();
store.hydrate(ch=>{if(!ch)return;reloadPersisted();if(S.mode=='menu'||S.mode=='pause'&&svWelcomeOn){if(!svWelcome())menu()}});
